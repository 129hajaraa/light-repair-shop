<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ede7da"><title>光路修理铺 — 三封委托</title><link rel="stylesheet" href="style.css"></head><body>
<header class="masthead"><a class="brand" href="#" aria-label="光路修理铺首页"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17"/><path d="M8 28h12V12h12M13 33l14-14"/></svg><span>光路修理铺<small>LIGHT REPAIR SHOP</small></span></a><div class="top-actions"><button id="sound" class="quiet" aria-pressed="false">声音 关</button><button id="help" class="quiet">玩法说明</button></div></header>
<main><div class="chapter"><span>一间小铺，三封委托</span><nav id="nav" aria-label="选择委托"></nav><span id="progress">已完成 0 / 3</span></div><div class="workbench"><section class="play-area"><div class="board-caption"><span id="caseNo"></span><span>转动镜片 · 看见光路</span></div><div class="board-shell"><div id="board"><svg id="scene" viewBox="0 0 800 600" role="img" aria-label="光学工作台"><defs><pattern id="holes" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="50" cy="50" r="2" fill="#b5aa8c"/><circle cx="50" cy="50" r="5" fill="none" stroke="#c7bc9d" stroke-width="1"/></pattern></defs><rect width="800" height="600" fill="#d6c9a6"/><rect x="17" y="17" width="766" height="566" rx="8" fill="none" stroke="#bbae8c"/><rect width="800" height="600" fill="url(#holes)"/><g id="blockers"></g><g id="beam"></g><g id="fixtures"></g></svg><div id="parts"></div></div><i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i></div><div class="bench-controls"><button id="undo" class="tool" title="快捷键 Z">↶ <span>撤销</span></button><button id="reset" class="tool">↺ <span>重置</span></button><span class="moves" id="moves"></span><button id="hint" class="tool hint">需要一点提示？</button></div><div id="hintBox" hidden></div></section>
<aside class="docket"><div class="docket-top"><span>维修委托</span><span id="docketNo"></span></div><h1 id="title"></h1><p id="client" class="client"></p><blockquote id="letter"></blockquote><div class="separator"><span>检查读数</span></div><div id="meters"></div><p id="status" role="status" aria-live="polite"></p><div id="success" hidden><span class="stamp">修理完成</span><p id="fact"></p><button id="next" class="primary">下一封委托 <span>→</span></button></div><div id="instruction"><svg viewBox="0 0 50 50" aria-hidden="true"><circle cx="25" cy="25" r="18"/><path d="M14 36l22-22M39 8l3 10-10-2"/></svg><p>轻点圆形镜座，旋转镜片。<br>光路会立即改变。</p></div></aside></div><footer><span>慢慢来，没有倒计时。</span><span>玩法验证版 0.2 · 简化光学模型</span></footer></main>
<dialog id="helpDialog"><button id="closeHelp" class="close" aria-label="关闭说明">×</button><small>工作台使用手册</small><h2>把光，送到刚好的地方。</h2><p>点击圆形镜座，在 ／ 和 ＼ 两个方向间切换。</p><p>第二封委托会出现滤镜。点击它可在全光、½、¼ 之间切换。</p><p>读数表上的绿色区间是目标。光线到达了，但太亮或太暗，仍然需要调整。</p><p class="fine">可随时撤销、重置或切换委托。键盘 Tab 选中器件，Enter / 空格操作；Z 撤销。完成记录只保存在当前浏览器，不联网。</p><button id="start" class="primary">回到工作台</button></dialog><script src="engine.js"></script><script src="app.js"></script></body></html>
